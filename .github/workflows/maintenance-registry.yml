---
name: Cleanup GHCR Image Registry

on:
  schedule:
    - cron: "44 4 * * *"
  workflow_dispatch:

jobs:
  ghcr-cleanup-image:
    runs-on: ubuntu-26.04

    permissions:
      packages: write

    concurrency:
      group: ghcr-cleanup-image

    steps:
      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          exclude-tags: main,latest
          older-than: 180 days
          delete-tags: "*"

      - uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          delete-untagged: True
          delete-orphaned-images: True
