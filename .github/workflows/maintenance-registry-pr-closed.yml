---
name: Cleanup Pull Request Images

on:
  pull_request:
    types: [closed]

jobs:
  ghcr-cleanup-image:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Delete image
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          delete-tags: pr-${{ github.event.pull_request.number }}
